name: Compile Contracts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Compile contracts
      env:
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        BASE_RPC: ${{ secrets.BASE_RPC }}
      run: |
        npm run compile
        npm run compile:base

    - name: Check file sizes
      run: |
        ls -lh artifacts/contracts/ERC721.sol/MyToken.json
        ls -lh artifacts-pvm/contracts/ERC721.sol/MyToken.json
