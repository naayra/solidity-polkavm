name: Deploy Contracts

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
    
    - name: Deploy simple ERC721 token
      env:
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        HARDHAT_IGNITION_CONFIRM_DEPLOYMENT: true
      run: bun run deploy 

    - name: Deploy another ERC721 token
      env:
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        HARDHAT_IGNITION_CONFIRM_DEPLOYMENT: true
      run: bun run deploy:another
